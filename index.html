<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05060f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Star Words">
  <title>Star Words</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="scene" hidden></canvas>

  <header class="bar">
    <button id="back" class="icon-btn" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg>
    </button>
    <div id="progress" class="progress" aria-hidden="true" hidden></div>
    <div id="label" class="label" hidden></div>
    <button id="mute" class="icon-btn mute" aria-label="Music and sound effects on or off">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 4h11v3H12v10.5A3.5 3.5 0 118.5 14H9z"/></svg>
    </button>
    <div id="total" class="total" aria-label="Crystals found" hidden></div>
  </header>

  <main id="title" class="screen">
    <h1 class="logo"><span>Star</span><span>Words</span></h1>
    <canvas id="title-art"></canvas>
    <button id="start" class="btn primary">Play</button>
  </main>

  <main id="story" class="screen" hidden>
    <canvas id="story-art"></canvas>
    <p class="story-text">A space storm has scattered the star crystals across the galaxy!</p>
    <p class="story-text">Nova and her little droid Pip are flying out to find them. But Pip cannot read the word doors.</p>
    <p class="story-text hi">Can you help?</p>
    <button id="go" class="btn primary">Let's go</button>
  </main>

  <main id="map" class="screen" hidden>
    <div id="planets" class="planets"><canvas id="ship"></canvas></div>
  </main>

  <main id="planet" class="screen" hidden></main>

  <main id="play" class="screen" hidden>
    <div id="zone" class="zone">
      <div id="word" class="word"></div>
    </div>
    <button id="hear" class="hear" aria-label="Hear the word again" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="options" class="options"></div>
  </main>

  <div id="reward" class="reward" hidden>
    <canvas id="reward-art"></canvas>
    <p id="reward-text"></p>
  </div>

  <div id="warp" hidden></div>

  <script src="art.js"></script>
  <script src="sound.js"></script>
  <script src="game.js"></script>
</body>
</html>
